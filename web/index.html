<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命理解读师 · 控制台</title>
<style>
  :root {
    --gold: #c9a227;
    --gold-dim: #a8841a;
    --ink: #1c1a16;
    --paper: #f7f3ea;
    --card: #ffffff;
    --line: #e6ddc8;
    --muted: #8a8172;
    --good: #2f9e44;
    --warn: #e8590c;
    --danger: #c92a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, #1c1a16 0%, #3a2f1a 100%);
    color: var(--gold);
    padding: 22px 24px;
    border-bottom: 2px solid var(--gold);
  }
  header h1 { margin: 0; font-size: 22px; letter-spacing: 2px; }
  header p { margin: 4px 0 0; color: #b9ad8d; font-size: 13px; }
  .wrap { max-width: 860px; margin: 24px auto; padding: 0 16px; }
  .statusbar {
    background: var(--ink); color: #e8ddbe; border-radius: 10px;
    padding: 12px 16px; margin-bottom: 18px; font-size: 14px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .statusbar .id { color: var(--gold); font-weight: 700; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px 22px; margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .card h2 { margin: 0 0 14px; font-size: 17px; color: var(--gold-dim); border-left: 4px solid var(--gold); padding-left: 10px; }
  .card.locked { opacity: 0.55; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 13px; color: var(--muted); }
  input, select, textarea {
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 14px; font-family: inherit; background: #fffdf8; color: var(--ink);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid rgba(201,162,39,0.35); border-color: var(--gold); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg label { padding: 8px 16px; cursor: pointer; background: #fffdf8; font-size: 14px; color: var(--ink); }
  .seg input { display: none; }
  .seg input:checked + span { background: var(--gold); color: #fff; display: block; padding: 8px 16px; margin: -8px -16px; }
  button {
    background: var(--gold); color: #fff; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  button:hover { background: var(--gold-dim); }
  button:disabled { background: #c9c2b0; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--gold-dim); border: 1px solid var(--gold); }
  .hint { color: var(--muted); font-size: 12px; }
  .result { margin-top: 14px; padding: 12px 14px; background: #fbf7ec; border: 1px dashed var(--line); border-radius: 8px; font-size: 13px; white-space: pre-wrap; word-break: break-all; display: none; }
  .result.show { display: block; }
  .q { margin-bottom: 12px; }
  .q label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .q input { width: 100%; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; }
  .badge.match { background: #e6f4ea; color: var(--good); }
  .badge.conflict { background: #fdecec; color: var(--danger); }
  .link { color: var(--gold-dim); font-weight: 700; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  th { background: #f3ecd9; }
</style>
</head>
<body>
<header>
  <h1>命理解读师 · 控制台</h1>
  <p>紫微斗数 · 多步骤接口调用面板（DeepSeek 解读 + 通义千问识图）</p>
</header>

<div class="wrap">
  <div class="statusbar">
    <span>会话：<span class="id" id="sidText">未创建</span></span>
    <span id="statusText">请先完成第一步排盘</span>
    <a class="link" id="htmlLink" target="_blank" style="display:none;">打开命盘 HTML ↗</a>
  </div>

  <!-- 第一步：排盘 -->
  <section class="card">
    <h2>① 排盘（必做）</h2>
    <div class="row">
      <div class="field">
        <label>历法</label>
        <div class="seg">
          <label><input type="radio" name="calendar" value="solar" checked><span>公历</span></label>
          <label><input type="radio" name="calendar" value="lunar"><span>农历</span></label>
        </div>
      </div>
      <div class="field">
        <label>出生日期 (YYYY-M-D)</label>
        <input id="date" type="text" value="1991-8-15" placeholder="如 1991-8-15">
      </div>
      <div class="field">
        <label>时辰</label>
        <select id="hour">
          <option value="0">0 · 早子时 (23-00)</option>
          <option value="1" selected>1 · 丑时 (01-03)</option>
          <option value="2">2 · 寅时 (03-05)</option>
          <option value="3">3 · 卯时 (05-07)</option>
          <option value="4">4 · 辰时 (07-09)</option>
          <option value="5">5 · 巳时 (09-11)</option>
          <option value="6">6 · 午时 (11-13)</option>
          <option value="7">7 · 未时 (13-15)</option>
          <option value="8">8 · 申时 (15-17)</option>
          <option value="9">9 · 酉时 (17-19)</option>
          <option value="10">10 · 戌时 (19-21)</option>
          <option value="11">11 · 亥时 (21-23)</option>
          <option value="12">12 · 晚子时 (23-00)</option>
        </select>
      </div>
      <div class="field">
        <label>性别</label>
        <div class="seg">
          <label><input type="radio" name="gender" value="男" checked><span>男</span></label>
          <label><input type="radio" name="gender" value="女"><span>女</span></label>
        </div>
      </div>
      <div class="field">
        <label>农历闰月</label>
        <div class="seg">
          <label><input type="radio" name="leap" value="0" checked><span>否</span></label>
          <label><input type="radio" name="leap" value="1"><span>是</span></label>
        </div>
      </div>
      <div class="field">
        <label>目标流年</label>
        <input id="year" type="number" style="width:110px;">
      </div>
      <button onclick="createChart()">开始排盘</button>
    </div>
    <div class="result" id="chartResult"></div>
  </section>

  <!-- 第二步：校准（可选） -->
  <section class="card locked" id="step2">
    <h2>② 校准问答（可选）</h2>
    <button class="ghost" onclick="loadQuestions()">出题</button>
    <div id="questionsBox" style="margin-top:14px;"></div>
    <button id="answersBtn" style="display:none;margin-top:12px;" onclick="submitAnswers()">提交答案</button>
    <div class="result" id="answersResult"></div>
  </section>

  <!-- 第三步：手相（可选） -->
  <section class="card locked" id="step3">
    <h2>③ 手相互证（可选）</h2>
    <div class="row">
      <div class="field">
        <label>手相照片</label>
        <input id="palmImage" type="file" accept="image/*">
      </div>
      <div class="field" style="flex:1;min-width:260px;">
        <label>或 文字描述</label>
        <input id="palmDesc" type="text" placeholder="生命线长而清晰，智慧线下弯，感情线深…">
      </div>
      <button onclick="submitPalm()">识别并比对</button>
    </div>
    <div class="hint" style="margin-top:6px;">照片走通义千问 qwen-vl 识别，文字描述直接比对；都留空则跳过本步。</div>
    <div class="result" id="palmResult"></div>
  </section>

  <!-- 第四步：解读 -->
  <section class="card locked" id="step4">
    <h2>④ 大模型解读（生成命盘）</h2>
    <button id="interpretBtn" onclick="interpret()">生成解读</button>
    <div class="hint" style="margin-top:6px;">调用 deepseek-v4-pro，约 1-2 分钟。</div>
    <div class="result" id="interpretResult"></div>
  </section>

  <!-- 八字（BaZi） -->
  <div style="margin:30px 0 12px;border-top:2px solid var(--gold);padding-top:16px;text-align:center;color:var(--gold-dim);font-weight:700;letter-spacing:2px;">八字（BaZi）· 四柱命理</div>

  <section class="card">
    <h2>八字排盘</h2>
    <div class="row">
      <div class="field">
        <label>历法</label>
        <div class="seg">
          <label><input type="radio" name="baziCalendar" value="solar" checked><span>公历</span></label>
          <label><input type="radio" name="baziCalendar" value="lunar"><span>农历</span></label>
        </div>
      </div>
      <div class="field">
        <label>出生日期 (YYYY-M-D)</label>
        <input id="baziDate" type="text" value="1990-5-15">
      </div>
      <div class="field">
        <label>性别</label>
        <div class="seg">
          <label><input type="radio" name="baziSex" value="男" checked><span>男</span></label>
          <label><input type="radio" name="baziSex" value="女"><span>女</span></label>
        </div>
      </div>
      <div class="field">
        <label>时辰地支</label>
        <select id="baziShichen">
          <option value="">未知</option>
          <option value="子">子 (23-01)</option>
          <option value="丑">丑 (01-03)</option>
          <option value="寅">寅 (03-05)</option>
          <option value="卯">卯 (05-07)</option>
          <option value="辰">辰 (07-09)</option>
          <option value="巳">巳 (09-11)</option>
          <option value="午">午 (11-13)</option>
          <option value="未">未 (13-15)</option>
          <option value="申">申 (15-17)</option>
          <option value="酉">酉 (17-19)</option>
          <option value="戌">戌 (19-21)</option>
          <option value="亥">亥 (21-23)</option>
        </select>
      </div>
      <div class="field">
        <label>或出生钟点 HH:MM</label>
        <input id="baziHour" type="text" placeholder="如 12:30">
      </div>
      <button onclick="createBazi()">排八字</button>
    </div>
    <div class="result" id="baziChartResult"></div>
  </section>

  <section class="card locked" id="baziStep2">
    <h2>八字解读</h2>
    <button id="baziInterpretBtn" onclick="interpretBazi()">生成八字解读</button>
    <div class="hint" style="margin-top:6px;">调用 deepseek-v4-pro，约 1-2 分钟。</div>
    <div class="result" id="baziInterpretResult"></div>
  </section>
</div>

<script>
var currentId = null;

function $(id) { return document.getElementById(id); }

function showResult(id, text, isErr) {
  var el = $(id);
  el.textContent = text;
  el.style.borderColor = isErr ? 'var(--danger)' : 'var(--gold)';
  el.classList.add('show');
}

function setBusy(btn, busy, label) {
  if (btn) { btn.disabled = busy; btn.innerHTML = busy ? '<span class="spin"></span>' + label : label; }
}

async function api(path, options) {
  var resp = await fetch(path, options);
  var text = await resp.text();
  var data = null;
  try { data = JSON.parse(text); } catch (e) { data = text; }
  if (!resp.ok) {
    var msg = (data && data.detail) ? data.detail : ('HTTP ' + resp.status);
    throw new Error(msg);
  }
  return data;
}

function unlockSteps() {
  $('step2').classList.remove('locked');
  $('step3').classList.remove('locked');
  $('step4').classList.remove('locked');
}

function initYear() {
  $('year').value = new Date().getFullYear();
}
initYear();

async function createChart() {
  var calendar = document.querySelector('input[name="calendar"]:checked').value;
  var gender = document.querySelector('input[name="gender"]:checked').value;
  var leap = document.querySelector('input[name="leap"]:checked').value === '1';
  var body = {
    calendar: calendar,
    date: $('date').value.trim(),
    hour: parseInt($('hour').value, 10),
    gender: gender,
    leap: leap,
    year: $('year').value ? parseInt($('year').value, 10) : null
  };
  try {
    var data = await api('/api/chart', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    currentId = data.id;
    $('sidText').textContent = '#' + data.id;
    $('statusText').textContent = '状态：' + data.status + ' · 格局：' + (data.gezhi && data.gezhi.gezhi_name ? data.gezhi.gezhi_name : '-');
    var b = data.basic || {};
    showResult('chartResult',
      '排盘成功！\n' +
      '公历 ' + (b.solar || '-') + ' / 农历 ' + (b.lunar || '-') + '\n' +
      '五行局 ' + (b.five_elements || '-') + ' · 命宫 ' + (b.soul_palace_branch || '-') + ' · 身宫 ' + (b.body_palace_branch || '-') + '\n' +
      '格局：' + (data.gezhi && data.gezhi.gezhi_name ? data.gezhi.gezhi_name : '-') + '\n\n' +
      (data.summary || '')
    );
    unlockSteps();
  } catch (e) {
    showResult('chartResult', '排盘失败：' + e.message, true);
  }
}

async function loadQuestions() {
  if (!currentId) { alert('请先排盘'); return; }
  try {
    var data = await api('/api/' + currentId + '/questions');
    var box = $('questionsBox');
    var html = '';
    data.questions.forEach(function(q) {
      html += '<div class="q"><label>' + q.text + ' <span class="hint">' + (q.hint || '') + '</span></label>';
      html += '<input type="text" data-qid="' + q.id + '" placeholder="你的回答…"></div>';
    });
    box.innerHTML = html;
    $('answersBtn').style.display = 'inline-block';
  } catch (e) {
    showResult('answersResult', '出题失败：' + e.message, true);
  }
}

async function submitAnswers() {
  if (!currentId) { alert('请先排盘'); return; }
  var inputs = document.querySelectorAll('#questionsBox input[data-qid]');
  var answers = [];
  inputs.forEach(function(inp) {
    if (inp.value.trim()) { answers.push({ id: inp.getAttribute('data-qid'), answer: inp.value.trim() }); }
  });
  if (!answers.length) { alert('请先填写至少一个答案'); return; }
  var btn = $('answersBtn');
  setBusy(btn, true, '提交中…');
  try {
    var data = await api('/api/' + currentId + '/answers', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers: answers })
    });
    setBusy(btn, false, '提交答案');
    showResult('answersResult', '已提交 ' + data.received + ' 条答案');
  } catch (e) {
    setBusy(btn, false, '提交答案');
    showResult('answersResult', '提交失败：' + e.message, true);
  }
}

async function submitPalm() {
  if (!currentId) { alert('请先排盘'); return; }
  var file = $('palmImage').files[0];
  var desc = $('palmDesc').value.trim();
  if (!file && !desc) { alert('请上传照片或填写文字描述'); return; }
  var fd = new FormData();
  if (file) { fd.append('image', file); }
  if (desc) { fd.append('description', desc); }
  showResult('palmResult', '识别并比对中…（约 1-2 分钟）');
  try {
    var data = await api('/api/' + currentId + '/palm', { method: 'POST', body: fd });
    var items = (data.hand_reading && data.hand_reading.items) ? data.hand_reading.items : [];
    var out = '掌纹特征：\n' + (data.palm_features || '') + '\n\n交叉比对结果：\n';
    items.forEach(function(it) {
      out += (it.status === 'conflict' ? '⚠ ' : '✓ ') + it.title + ' — ' + (it.status_text || '') + '\n';
    });
    showResult('palmResult', out);
  } catch (e) {
    showResult('palmResult', '手相比对失败：' + e.message, true);
  }
}

async function interpret() {
  if (!currentId) { alert('请先排盘'); return; }
  var btn = $('interpretBtn');
  setBusy(btn, true, '解读中（约1-2分钟）…');
  showResult('interpretResult', '正在调用 DeepSeek 解读，请稍候…');
  try {
    var data = await api('/api/' + currentId + '/interpret', { method: 'POST' });
    setBusy(btn, false, '生成解读');
    var cards = (data.reading && data.reading.cards) ? data.reading.cards : [];
    $('statusText').textContent = '状态：interpreted · 生成 ' + cards.length + ' 张卡片';
    var link = $('htmlLink');
    link.href = data.html_url;
    link.style.display = 'inline';
    showResult('interpretResult', '解读完成！共 ' + cards.length + ' 张卡片。\n点击右上角「打开命盘 HTML ↗」查看完整命盘。');
  } catch (e) {
    setBusy(btn, false, '生成解读');
    showResult('interpretResult', '解读失败：' + e.message, true);
  }
}
var baziId = null;

async function createBazi() {
  var calendar = document.querySelector('input[name="baziCalendar"]:checked').value;
  var sex = document.querySelector('input[name="baziSex"]:checked').value;
  var hour = $('baziHour').value.trim() || null;
  var shichen = $('baziShichen').value || null;
  var body = { calendar: calendar, date: $('baziDate').value.trim(), sex: sex, hour: hour, shichen: shichen };
  try {
    var data = await api('/api/bazi/chart', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    baziId = data.id;
    $('sidText').textContent = '#' + data.id + '（八字）';
    $('statusText').textContent = '八字排盘完成';
    showResult('baziChartResult', data.report);
    $('baziStep2').classList.remove('locked');
  } catch (e) {
    showResult('baziChartResult', '排盘失败：' + e.message, true);
  }
}

async function interpretBazi() {
  if (!baziId) { alert('请先排八字'); return; }
  var btn = $('baziInterpretBtn');
  setBusy(btn, true, '解读中（约1-2分钟）…');
  showResult('baziInterpretResult', '正在调用 DeepSeek 解读，请稍候…');
  try {
    var data = await api('/api/bazi/' + baziId + '/interpret', { method: 'POST' });
    setBusy(btn, false, '生成八字解读');
    var rd = data.reading || {};
    var link = $('htmlLink');
    link.href = data.html_url;
    link.style.display = 'inline';
    var out = '命局总评：' + (rd.summary || '') + '\n\n日主：' + (rd.day_master || '') + '\n\n格局：' + (rd.geju || '') + '\n\n大运：' + (rd.dayun || '') + '\n\n流年：' + (rd.liunian || '');
    showResult('baziInterpretResult', out + '\n\n点击右上角「打开命盘 HTML ↗」查看完整报告。');
  } catch (e) {
    setBusy(btn, false, '生成八字解读');
    showResult('baziInterpretResult', '解读失败：' + e.message, true);
  }
}
</script>
</body>
</html>
